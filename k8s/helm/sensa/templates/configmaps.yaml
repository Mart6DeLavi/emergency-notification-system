{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.configMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svc.configMap }}
  labels:
    {{- include "sensa.labels" $ | nindent 4 }}
data:
  config.yaml: |
{{ tpl ($.Files.Get (printf "files/%s.config.yaml" $name)) $ | indent 4 }}
{{- end }}
{{- end }}
