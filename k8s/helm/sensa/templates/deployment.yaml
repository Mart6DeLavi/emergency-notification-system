{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "sensa.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            # Injected first so that $(POSTGRES_USERNAME) style expansion works
            # in service-specific env values below.
            - name: JWT_USER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sensa-secrets
                  key: JWT_USER_SECRET
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sensa-secrets
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sensa-secrets
                  key: POSTGRES_PASSWORD
            {{- if $svc.configMap }}
            - name: CONFIG_PATH
              value: /app/config.yaml
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
          {{- if $svc.configMap }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default "/actuator/health" }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default "/actuator/health" }}
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- if $svc.configMap }}
      volumes:
        - name: config
          configMap:
            name: {{ $svc.configMap }}
      {{- end }}
{{- end }}
{{- end }}
