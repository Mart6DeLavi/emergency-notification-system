apiVersion: v1
kind: Secret
metadata:
  name: sensa-secrets
  labels:
    {{- include "sensa.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_USER_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_USERNAME: {{ .Values.secrets.postgresUsername | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
