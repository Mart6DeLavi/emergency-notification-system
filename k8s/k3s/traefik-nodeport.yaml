# Expose the k3s Traefik ingress controller on fixed NodePorts so that the
# host Caddy (Docker Compose, ports 80/443) can proxy to it.
#
# Apply with:
#   kubectl apply -f k8s/k3s/traefik-nodeport.yaml
#   kubectl -n kube-system rollout restart deploy/traefik
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
