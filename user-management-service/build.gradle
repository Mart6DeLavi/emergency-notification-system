plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sensa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
    set('netty.version', '4.1.133.Final')
    set('spring-security.version', '6.4.6')
    set('spring-framework.version', '6.2.11')
    set('jackson-bom.version', '2.18.11')
    set('bouncycastle.version', '1.80.2')
    set('kafka.version', '3.9.2')
    set('spring-kafka.version', '3.3.16')
    set('httpclient5.version', '5.4.3')
    set('micrometer.version', '1.15.12')
}


// Core Reactive
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    compileOnly 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    implementation 'org.liquibase:liquibase-core:4.26.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// Security Reactive
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
}


// Redis Reactive
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
}


// Kafka Reactive
dependencies {
    implementation 'org.springframework.kafka:spring-kafka'
}


// Eureka + LoadBalancer
dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
}


// OpenAPI WebFlux
dependencies {
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.7.0'
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


tasks.named('test') {
    useJUnitPlatform()
}
configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:33.7.2-jre'
        force 'com.thoughtworks.xstream:xstream:1.4.21'
        force 'org.xerial.snappy:snappy-java:1.1.10.9'
        force 'org.lz4:lz4-java:1.8.1'
    }
}
