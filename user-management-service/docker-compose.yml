version: '3.8'

services:
  user-data-management-service:
    build: .
    image: user-data-management-service:latest
    container_name: user-data-management-service
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: 28859013
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://localhost:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - zookeeper
      - kafka
      - redis
    networks:
      - user-data-management-net

  postgres:
    image: postgres:15.2
    container_name: postgres-user-data
    environment:
      POSTGRES_DB: Sensa_User_Data_Management_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
    ports:
      - "5432:5432"
    networks:
      - user-data-management-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper-user-data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - user-data-management-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-user-data
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-user-data:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-user-data:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - user-data-management-net

  redis:
    image: redis:7-alpine
    container_name: redis-user-data
    ports:
      - "6379:6379"
    networks:
      - user-data-management-net

networks:
  user-data-management-net:
    driver: bridge
