version: '3.8'

services:
  filesystem-service:
    build: .
    image: filesystem-service:latest
    container_name: filesystem-service
    ports:
      - "8002:8002"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_USER_SECRET: ${JWT_USER_SECRET:-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    depends_on:
      - postgres
      - kafka
    networks:
      - sensa-network

  postgres:
    image: postgres:15.2
    container_name: filesystem-postgres
    environment:
      POSTGRES_DB: Sensa_File_System_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    networks:
      - sensa-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: filesystem-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2185:2181"
    networks:
      - sensa-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: filesystem-kafka
    depends_on:
      - zookeeper
    ports:
      - "9096:9092"
    environment:
      KAFKA_BROKER_ID: 5
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - sensa-network

networks:
  sensa-network:
    driver: bridge
