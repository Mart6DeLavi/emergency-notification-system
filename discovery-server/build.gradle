plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sensa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
    set('netty.version', '4.1.133.Final')
    set('spring-security.version', '6.4.6')
    set('spring-framework.version', '6.2.11')
    set('jackson-bom.version', '2.18.11')
    set('bouncycastle.version', '1.80.2')
    set('kafka.version', '3.9.2')
    set('spring-kafka.version', '3.3.16')
    set('httpclient5.version', '5.4.3')
    set('micrometer.version', '1.15.12')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:33.7.2-jre'
        force 'com.thoughtworks.xstream:xstream:1.4.21'
        force 'org.xerial.snappy:snappy-java:1.1.10.9'
        force 'org.lz4:lz4-java:1.8.1'
    }
}
