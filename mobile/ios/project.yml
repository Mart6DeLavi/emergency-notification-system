name: SENSA

options:
  bundleIdPrefix: com.sensa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SENSA:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensa.mobile
        PRODUCT_NAME: SENSA
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_CFBundleDisplayName: SENSA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

schemes:
  SENSA:
    build:
      targets:
        SENSA: all
    run:
      config: Debug
