name: SENSA

options:
  bundleIdPrefix: com.sensa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SENSA:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SENSA
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - pl
        NSPhotoLibraryUsageDescription: "SENSA needs access to your photos and videos so you can attach evidence to an emergency report."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensa.mobile
        PRODUCT_NAME: SENSA
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

  SENSATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SENSATests
    dependencies:
      - target: SENSA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensa.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SENSA.app/SENSA"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SENSA:
    build:
      targets:
        SENSA: all
        SENSATests: [test]
    test:
      targets:
        - SENSATests
    run:
      config: Debug
