version: '3.8'

services:
  api-gateway:
    build: .
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8007:8007"
    environment:
      CONFIG_PATH: /app/config.yaml
      RUST_LOG: api_gateway=info
    networks:
      - sensa-network

networks:
  sensa-network:
    driver: bridge
