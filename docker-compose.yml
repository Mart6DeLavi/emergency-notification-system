version: '3.8'

services:
  authentication-service-postgres:
    container_name: authentication-service-postgres
    hostname: authentication-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: Sensa_Authentication_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-authentication:/data

  notification-service-postgres:
    container_name: notification-service-postgres
    hostname: notification-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: Sensa_Notification_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-notification:/data

  template-service-postgres:
    container_name: template-service-postgres
    hostname: template-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: Sensa_Template_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-template:/data

  user-data-management-service-postgres:
    container_name: user-data-management-service-postgres
    hostname: user-data-management-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5436:5432'
    environment:
      POSTGRES_DB: Sensa_User_Data_Management_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-user-management:/data

  filesystem-service-postgres:
    container_name: filesystem-service-postgres
    hostname: filesystem-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5437:5432'
    environment:
      POSTGRES_DB: Sensa_File_System_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-filesystem:/data

  emergency-service-postgres:
    container_name: emergency-service-postgres
    hostname: emergency-service-postgres
    image: postgres:15.2
    restart: always
    ports:
      - '5438:5432'
    environment:
      POSTGRES_DB: Sensa_Emergency_Service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28859013
      PGDATA: /data
    volumes:
      - db-postgres-emergency:/data

  redis:
    container_name: redis
    image: redis:7.0.11
    restart: always
    ports:
      - '6379:6379'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    restart: always

  broker:
    image: confluentinc/cp-kafka:7.3.2
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'

  sensa-discovery-server:
    container_name: sensa-discovery-server
    image: discovery-service:latest
    restart: always
    ports:
      - '8761:8761'

  sensa-load-balancer-service:
    container_name: sensa-load-balancer-service
    image: load-balancer-service:latest
    restart: always
    ports:
      - '8008:8008'

  sensa-rate-limiter-service:
    container_name: sensa-rate-limiter-service
    image: rate-limiter-service:latest
    restart: always
    ports:
      - '8009:8009'
    depends_on:
      - redis

  sensa-api-gateway:
    container_name: sensa-api-gateway
    image: api-gateway:latest
    restart: always
    ports:
      - '8080:8007'
    depends_on:
      - sensa-load-balancer-service
      - sensa-rate-limiter-service

  sensa-authentication-service:
    container_name: sensa-authentication-service
    image: authentication-service:latest
    restart: always
    depends_on:
      - authentication-service-postgres
      - sensa-discovery-server
      - broker
      - zookeeper
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  sensa-user-data-management-service:
    container_name: sensa-user-data-management-service
    image: user-data-management-service:latest
    restart: always
    depends_on:
      - user-data-management-service-postgres
      - sensa-discovery-server
      - broker
      - zookeeper
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  sensa-message-delivery-service:
    container_name: sensa-message-delivery-service
    image: message-delivery-service:latest
    restart: always
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672/%2f

  sensa-notification-service:
    container_name: sensa-notification-service
    image: notification-service:latest
    restart: always
    depends_on:
      - notification-service-postgres
      - sensa-discovery-server
      - broker
      - zookeeper
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  sensa-template-service:
    container_name: sensa-template-service
    image: template-service:latest
    restart: always
    depends_on:
      - template-service-postgres
      - sensa-discovery-server
      - broker
      - zookeeper
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  sensa-filesystem-service:
    container_name: sensa-filesystem-service
    image: filesystem-service:latest
    restart: always
    depends_on:
      - filesystem-service-postgres
      - sensa-discovery-server
      - broker
      - zookeeper
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  sensa-emergency-situation-request-service:
    container_name: sensa-emergency-situation-request-service
    image: emergency-situation-request-service:latest
    restart: always
    depends_on:
      - emergency-service-postgres
      - broker
      - zookeeper
    environment:
      DATABASE_URL: postgres://postgres:28859013@emergency-service-postgres:5432/Sensa_Emergency_Service
      KAFKA_BROKERS: broker:9092

volumes:
  db-postgres-authentication:
  db-postgres-notification:
  db-postgres-template:
  db-postgres-user-management:
  db-postgres-filesystem:
  db-postgres-emergency:
