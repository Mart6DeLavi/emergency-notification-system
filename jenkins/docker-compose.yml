version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: sensa-jenkins
    restart: always
    ports:
      - '8081:8080'
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    networks:
      - sensa-jenkins-net

  jenkins-agent-gradle:
    image: jenkins/inbound-agent:jdk21
    container_name: sensa-jenkins-agent-gradle
    restart: always
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: gradle
      JENKINS_SECRET: ${JENKINS_AGENT_GRADLE_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sensa-jenkins-net

  jenkins-agent-rust:
    image: jenkins/inbound-agent:jdk21
    container_name: sensa-jenkins-agent-rust
    restart: always
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: rust
      JENKINS_SECRET: ${JENKINS_AGENT_RUST_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sensa-jenkins-net

networks:
  sensa-jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
