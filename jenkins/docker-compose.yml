services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: sensa-jenkins
    restart: always
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_URL: http://jenkins:8080
    group_add:
      - "${DOCKER_GID:-988}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sensa-jenkins-net
      - sensa-proxy

  jenkins-agent-gradle:
    build: ./agents/gradle
    image: sensa-jenkins-agent-gradle:latest
    container_name: sensa-jenkins-agent-gradle
    restart: always
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: gradle
      JENKINS_SECRET: ${JENKINS_AGENT_GRADLE_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-988}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sensa-jenkins-net

  jenkins-agent-rust:
    build: ./agents/rust
    image: sensa-jenkins-agent-rust:latest
    container_name: sensa-jenkins-agent-rust
    restart: always
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: rust
      JENKINS_SECRET: ${JENKINS_AGENT_RUST_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-988}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sensa-jenkins-net

networks:
  sensa-jenkins-net:
    driver: bridge
  sensa-proxy:
    external: true

volumes:
  jenkins_home:
