workflows:
  sensa-ios-simulator:
    name: SENSA iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      vars:
        XCODE_PROJECT: SENSA.xcodeproj
        XCODE_SCHEME: SENSA
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-app
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd mobile/ios
          xcodegen generate
      - name: Build for simulator
        script: |
          cd mobile/ios
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run unit tests
        script: |
          cd mobile/ios
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        script: |
          cd mobile/ios
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" SENSA-simulator.zip
    artifacts:
      - mobile/ios/SENSA-simulator.zip
